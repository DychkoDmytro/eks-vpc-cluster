apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlflow-postgres
  namespace: infra-tools
spec:
  project: default

  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: postgresql
    targetRevision: 15.5.38
    helm:
      values: |
        image:
          registry: docker.io
          repository: bitnamilegacy/postgresql
          tag: 16.4.0-debian-12-r9

        auth:
          postgresPassword: postgres123456
          username: mlflow
          password: mlflow123456
          database: mlflow

        primary:
          persistence:
            enabled: true
            storageClass: gp2
            size: 5Gi

        service:
          type: ClusterIP
          ports:
            postgresql: 5432

  destination:
    server: https://kubernetes.default.svc
    namespace: mlflow

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
